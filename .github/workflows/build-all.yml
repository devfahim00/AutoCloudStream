name: Build All Plugins

# Rebuilds the .cs3 files for every provider module currently in
# plugins-repo/ (useful after editing a provider by hand or when the
# CloudStream dependencies update).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-all-plugins
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v3

      - name: Build .cs3 plugins
        run: |
          cd plugins-repo
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon

      - name: Collect builds
        run: |
          mkdir -p builds
          rm -f builds/*.cs3 builds/plugins.json
          cp plugins-repo/*/build/*.cs3 builds/ 2>/dev/null || true
          cp plugins-repo/build/plugins.json builds/ 2>/dev/null || true
          if [ -f builds/plugins.json ]; then
            sed -i -e 's|/refs/heads/master/|/refs/heads/main/|g' \
                   -e 's|/refs/heads/builds/|/refs/heads/main/|g' builds/plugins.json
          fi
          ls -la builds/

      - name: Commit builds
        run: |
          git config user.name "AutoCloudStream Bot"
          git config user.email "actions@github.com"
          git add builds/
          git commit -m "Rebuild all .cs3 plugins [skip ci]" || echo "nothing new to commit"
          git push || echo "push skipped (no changes)"

      - name: Upload .cs3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs3-plugins
          path: builds/*.cs3
          if-no-files-found: warn
